info:
  name: Create Apiary
  type: http
  seq: 4

http:
  method: POST
  url: "{{smart_apiary_api_base_url}}apiaries"
  body:
    type: multipart-form
    data:
      - name: Name
        type: text
        value: Apiary North1
      - name: Latitude
        type: text
        value: "45.2671"
      - name: Longitude
        type: text
        value: "19.8335"
      - name: Description
        type: text
        value: Test apiary
      - name: ImageFile
        type: file
        value:
          - E:\Users\Documents\MILOS CLOUD\TestingAssets\apiary1.jpg
        contentType: File
  auth: inherit

runtime:
  variables:
    - name: smart_apiary_api_base_url
      value: https://localhost:7262/api/

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
