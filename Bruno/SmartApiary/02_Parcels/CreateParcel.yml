info:
  name: Create Parcel
  type: http
  seq: 1

http:
  method: POST
  url: "{{smart_apiary_api_base_url}}/parcels"
  body:
    type: json
    data: |
      {
        "name": "Parcel B",
        "latitude": 45.2682,
        "longitude": 19.8321
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setGlobalEnvVar("jwt_token", bru.getGlobalEnvVar("farmer_token"));
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [CreateParcel.yml] status:", res.status, "body:", JSON.stringify(res.body));
        bru.setGlobalEnvVar("parcel_id", res.body.id);
