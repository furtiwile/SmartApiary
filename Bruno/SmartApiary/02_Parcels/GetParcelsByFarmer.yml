info:
  name: Get Parcels By Farmer
  type: http
  seq: 2

http:
  method: GET
  url: "{{smart_apiary_api_base_url}}/parcels?farmerId={{farmer_user_id}}"
  params:
    - name: farmerId
      value: "{{farmer_user_id}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [GetParcelsByFarmer.yml] status:", res.status, "body:", JSON.stringify(res.body));
    - type: before-request
      code: |-
        bru.setGlobalEnvVar("jwt_token", bru.getGlobalEnvVar("farmer_token"));
