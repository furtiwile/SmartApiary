info:
  name: Update Parcel
  type: http
  seq: 5

http:
  method: PUT
  url: "{{smart_apiary_api_base_url}}/parcels/{{parcel_id}}"
  body:
    type: json
    data: |
      {
        "name": "Parcel B Updated",
        "latitude": 45.2690,
        "longitude": 19.8330
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [UpdateParcel.yml] status:", res.status, "body:", JSON.stringify(res.body));
    - type: before-request
      code: |-
        bru.setGlobalEnvVar("jwt_token", bru.getGlobalEnvVar("farmer_token"));
