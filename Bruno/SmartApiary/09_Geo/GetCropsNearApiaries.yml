info:
  name: Get Crops Near Apiaries
  type: http
  seq: 1

http:
  method: GET
  url: "{{smart_apiary_api_base_url}}/geo/crops-near-apiaries?radiusKm=10"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setGlobalEnvVar("jwt_token", bru.getGlobalEnvVar("beekeeper_token"));
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [GetCropsNearApiaries.yml] status:", res.status, "body:", JSON.stringify(res.body));
