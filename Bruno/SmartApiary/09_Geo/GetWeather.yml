info:
  name: Get Weather
  type: http
  seq: 2

http:
  method: GET
  url: "{{smart_apiary_api_base_url}}/geo/weather?latitude=45.2671&longitude=19.8335"
  params:
    - name: latitude
      value: "45.2671"
      type: query
    - name: longitude
      value: "19.8335"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [GetWeather.yml] status:", res.status, "body:", JSON.stringify(res.body));
    - type: before-request
      code: |-
        bru.setGlobalEnvVar("jwt_token", bru.getGlobalEnvVar("beekeeper_token"));
