info:
  name: Create Hive Inspection
  type: http
  seq: 3

http:
  method: POST
  url: "{{smart_apiary_api_base_url}}/hiveinspections"
  body:
    type: json
    data: |
      {
        "hiveId": "{{hive_id}}",
        "inspectionDate": "2026-05-26T09:00:00Z",
        "bottomBoardColor": "Red",
        "honeyFrames": 6,
        "honeyAmount": 12.5,
        "broodFrames": 5,
        "queenPresent": true,
        "note": "Routine inspection"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setGlobalEnvVar("jwt_token", bru.getGlobalEnvVar("beekeeper_token"));
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [CreateHiveInspection.yml] status:", res.status, "body:", JSON.stringify(res.body));
        bru.setGlobalEnvVar("hive_inspection_id", res.body.id);
