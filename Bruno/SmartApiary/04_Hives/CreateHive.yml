info:
  name: Create Hive
  type: http
  seq: 1

http:
  method: POST
  url: "{{smart_apiary_api_base_url}}/hives"
  body:
    type: json
    data: |
      {
        "apiaryId": "{{apiary_id}}",
        "designation": "H-01",
        "type": "LR",
        "superColor": "Blue",
        "queenAge": 2,
        "note": "Initial hive note",
        "smartScaleId": null
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setGlobalEnvVar("jwt_token", bru.getGlobalEnvVar("beekeeper_token"));
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [CreateHive.yml] status:", res.status, "body:", JSON.stringify(res.body));
        bru.setGlobalEnvVar("hive_id", res.body.id);
