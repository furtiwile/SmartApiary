info:
  name: Get Hive Inspections By Hive
  type: http
  seq: 4

http:
  method: GET
  url: "{{smart_apiary_api_base_url}}/hiveinspections?hiveId={{hive_id}}"
  params:
    - name: hiveId
      value: "{{hive_id}}"
      type: query
    - name: pageNumber
      value: "1"
      type: query
    - name: pageSize
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [GetHiveInspectionsByHive.yml] status:", res.status, "body:", JSON.stringify(res.body));
    - type: before-request
      code: |-
        bru.setGlobalEnvVar("jwt_token", bru.getGlobalEnvVar("beekeeper_token"));
