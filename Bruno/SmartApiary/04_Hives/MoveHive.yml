info:
  name: Move Hive
  type: http
  seq: 6

http:
  method: PUT
  url: "{{smart_apiary_api_base_url}}/hives/{{hive_id}}/move"
  body:
    type: json
    data: |
      {
        "targetApiaryId": "{{apiary_id_2}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [MoveHive.yml] status:", res.status, "body:", JSON.stringify(res.body));
    - type: before-request
      code: |-
        bru.setGlobalEnvVar("jwt_token", bru.getGlobalEnvVar("beekeeper_token"));
