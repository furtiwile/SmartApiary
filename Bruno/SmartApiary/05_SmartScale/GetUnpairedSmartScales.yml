info:
  name: Get Unpaired Smart Scales
  type: http
  seq: 5

http:
  method: GET
  url: "{{smart_apiary_api_base_url}}/smartscales/unpaired"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [GetUnpairedSmartScales.yml] status:", res.status, "body:", JSON.stringify(res.body));
    - type: before-request
      code: |-
        bru.setGlobalEnvVar("jwt_token", bru.getGlobalEnvVar("beekeeper_token"));
