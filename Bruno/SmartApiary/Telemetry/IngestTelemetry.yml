info:
  name: Ingest Telemetry
  type: http
  seq: 3

http:
  method: POST
  url: "{{smart_apiary_functions_base_url}}/telemetry"
  headers:
    - name: X-Device-Token
      value: REPLACE_WITH_DEVICE_TOKEN
  body:
    type: json
    data: |+
      {
        "hiveId": "22222222-2222-2222-2222-222222222222",
        "timestamp": "2026-05-26T10:00:00Z",
        "weightKg": 35.2,
        "temperatureC": 31.4,
        "humidityPercent": 58.0,
        "batteryPercent": 88.0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
