info:
  name: Reset Password
  type: http
  seq: 5

http:
  method: POST
  url: "{{smart_apiary_api_base_url}}/auth/reset-password"
  body:
    type: json
    data: |+
      {
        "token": "<reset-token>",
        "password": "NewUserPassword"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
