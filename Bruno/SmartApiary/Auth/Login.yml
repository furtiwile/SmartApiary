info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{smart_apiary_api_base_url}}/auth/login"
  body:
    type: json
    data: |
      {
        "email": "farmer@example.local",
        "password": "Password123!"
      }
  auth: inherit

runtime:
  variables:
    - name: smart_apiary_api_base_url
      value: http://localhost:5062/api

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

script:post-response: |
  bru.setGlobalEnvVar("jwt_token", res.body.token);
