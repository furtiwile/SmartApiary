info:
  name: Create Sprinkling Record
  type: http
  seq: 4

http:
  method: POST
  url: "{{smart_apiary_api_base_url}}/sprinklingrecords"
  body:
    type: json
    data: |
      {
        "announcementId": "{{announcement_id}}",
        "actualStartTime": "{{sprinkling_record_start_time}}",
        "actualEndTime": "{{sprinkling_record_end_time}}",
        "preparationType": "Herbicide A",
        "windSpeed": 3.5,
        "precipitation": 0.0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setGlobalEnvVar("jwt_token", bru.getGlobalEnvVar("farmer_token"));
        
        const actualStartTime = new Date();
        const actualEndTime = new Date(actualStartTime.getTime() + 1.5 * 60 * 60 * 1000);
        bru.setGlobalEnvVar("sprinkling_record_start_time", actualStartTime.toISOString());
        bru.setGlobalEnvVar("sprinkling_record_end_time", actualEndTime.toISOString());
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [CreateSprinklingRecord.yml] status:", res.status, "body:", JSON.stringify(res.body));
        bru.setGlobalEnvVar("sprinkling_record_id", res.body.id);
