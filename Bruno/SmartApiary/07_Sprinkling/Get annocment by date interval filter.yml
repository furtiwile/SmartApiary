info:
  name: "Get annocment by date interval filter"
  type: http
  seq: 8

http:
  method: GET
  url: "{{smart_apiary_api_base_url}}/sprinklingrecords?parcelId={{parcel_id}}&fromDate=2026-05-01T00:00:00Z&toDate=2026-07-01T00:00:00Z"
  params:
    - name: parcelId
      value: "{{parcel_id}}"
      type: query
    - name: fromDate
      value: 2026-05-01T00:00:00Z
      type: query
    - name: toDate
      value: 2026-07-01T00:00:00Z
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [Get annocment by date interval filter.yml] status:", res.status, "body:", JSON.stringify(res.body));
    - type: before-request
      code: |-
        bru.setGlobalEnvVar("jwt_token", bru.getGlobalEnvVar("farmer_token"));
