info:
  name: Reschedule Sprinkling Announcement
  type: http
  seq: 2

http:
  method: POST
  url: "{{smart_apiary_api_base_url}}/sprinklingannouncements/{{announcement_id}}/reschedule"
  body:
    type: json
    data: |
      {
        "parcelId": "{{parcel_id}}",
        "startTime": "{{sprinkling_reschedule_time}}",
        "expectedDurationHours": 2.5,
        "preparationType": "Herbicide A"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [RescheduleSprinklingAnnouncement.yml] status:", res.status, "body:", JSON.stringify(res.body));
    - type: before-request
      code: |-
        bru.setGlobalEnvVar("jwt_token", bru.getGlobalEnvVar("farmer_token"));
        
        const startTime = new Date();
        startTime.setHours(startTime.getHours() + 2);
        bru.setGlobalEnvVar("sprinkling_reschedule_time", startTime.toISOString());
