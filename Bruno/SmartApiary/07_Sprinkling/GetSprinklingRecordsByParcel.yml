info:
  name: Get sprinkling records by parcel
  type: http
  seq: 8

http:
  method: GET
  url: "{{smart_apiary_api_base_url}}/sprinklingrecords?parcelId={{parcel_id}}"
  params:
    - name: parcelId
      value: "{{parcel_id}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [GetSprinklingRecordsByParcel.yml] status:", res.status, "body:", JSON.stringify(res.body));
    - type: before-request
      code: |-
        bru.setGlobalEnvVar("jwt_token", bru.getGlobalEnvVar("farmer_token"));
