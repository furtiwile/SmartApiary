info:
  name: Get Sprinkling Records By Announcement
  type: http
  seq: 7

http:
  method: GET
  url: "{{smart_apiary_api_base_url}}/sprinklingrecords?announcementId={{announcement_id}}"
  params:
    - name: announcementId
      value: "{{announcement_id}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [GetSprinklingRecordsByAnnouncement.yml] status:", res.status, "body:", JSON.stringify(res.body));
    - type: before-request
      code: |-
        bru.setGlobalEnvVar("jwt_token", bru.getGlobalEnvVar("farmer_token"));
