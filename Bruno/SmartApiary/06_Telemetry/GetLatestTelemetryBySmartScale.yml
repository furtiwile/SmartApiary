info:
  name: Get Latest Telemetry By Smart Scale
  type: http
  seq: 3

http:
  method: GET
  url: "{{smart_apiary_api_base_url}}/telemetry/latest?smartScaleId={{smart_scale_id}}"
  params:
    - name: smartScaleId
      value: "{{smart_scale_id}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [GetLatestTelemetryBySmartScale.yml] status:", res.status, "body:", JSON.stringify(res.body));
    - type: before-request
      code: |-
        bru.setGlobalEnvVar("jwt_token", bru.getGlobalEnvVar("beekeeper_token"));
