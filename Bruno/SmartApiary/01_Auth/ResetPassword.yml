info:
  name: Reset Password
  type: http
  seq: 7

http:
  method: POST
  url: "{{smart_apiary_api_base_url}}/auth/reset-password"
  body:
    type: json
    data: |
      {
        "token": "{{reset_token}}",
        "password": "Password123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [ResetPassword.yml] status:", res.status, "body:", JSON.stringify(res.body));
