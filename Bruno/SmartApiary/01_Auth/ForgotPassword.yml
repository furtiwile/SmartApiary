info:
  name: Forgot Password
  type: http
  seq: 6

http:
  method: POST
  url: "{{smart_apiary_api_base_url}}/auth/forgot-password"
  body:
    type: json
    data: |
      {
        "email": "{{new_user_email}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [ForgotPassword.yml] status:", res.status, "body:", JSON.stringify(res.body));
        const link = res.body.resetLink;
        if (link && link.indexOf("token=") !== -1) {
        const token = link.split("token=")[1];
        bru.setGlobalEnvVar("reset_token", token);
        }
