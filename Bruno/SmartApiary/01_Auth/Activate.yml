info:
  name: Activate Account
  type: http
  seq: 5

http:
  method: POST
  url: "{{smart_apiary_api_base_url}}/auth/activate"
  body:
    type: json
    data: |
      {
        "token": "{{activation_token}}",
        "password": "NewUserPassword123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [Activate.yml] status:", res.status, "body:", JSON.stringify(res.body));
