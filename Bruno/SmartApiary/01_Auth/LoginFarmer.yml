info:
  name: Login Farmer
  type: http
  seq: 1

http:
  method: POST
  url: "{{smart_apiary_api_base_url}}/auth/login"
  body:
    type: json
    data: |
      {
        "email": "farmer@example.local",
        "password": "Password123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: before-request
      code: |-
        console.log("--- HELLO BEFORE REQUEST ---");
        bru.setGlobalEnvVar("smart_apiary_api_base_url", "http://localhost:5062/api");
        bru.setGlobalEnvVar("smart_apiary_functions_base_url", "http://localhost:7139");
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [LoginFarmer.yml] status:", res.status, "body:", JSON.stringify(res.body));
        console.log("--- HELLO AFTER RESPONSE ---");
        console.log("res.body type:", typeof res.body);
        console.log("res.body keys:", Object.keys(res.body || {}));
        console.log("res.body:", JSON.stringify(res.body));
        bru.setGlobalEnvVar("farmer_token", res.body.data.token);
        bru.setGlobalEnvVar("jwt_token", res.body.data.token);
        const token = res.body.data.token;
        if (token) {
          const parts = token.split('.');
          if (parts.length === 3) {
            const payload = JSON.parse(atob(parts[1]));
            const userId = payload.sub || payload["http://schemas.xmlsoap.org/ws/2005/05/identity/claims/nameidentifier"];
            bru.setGlobalEnvVar("farmer_user_id", userId);
            console.log("SET FARMER USER ID TO:", userId);
          }
        }
