info:
  name: Get Apiaries Near Parcel
  type: http
  seq: 3

http:
  method: GET
  url: "{{smart_apiary_api_base_url}}/geo/apiaries-near-parcel?parcelId={{parcel_id}}&radiusKm=5"
  params:
    - name: parcelId
      value: "{{parcel_id}}"
      type: query
    - name: radiusKm
      value: "5"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [GetApiariesNearParcel.yml] status:", res.status, "body:", JSON.stringify(res.body));
    - type: before-request
      code: |-
        bru.setGlobalEnvVar("jwt_token", bru.getGlobalEnvVar("beekeeper_token"));
