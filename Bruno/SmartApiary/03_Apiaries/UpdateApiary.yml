info:
  name: Update Apiary
  type: http
  seq: 4

http:
  method: PUT
  url: "{{smart_apiary_api_base_url}}/apiaries/{{apiary_id}}"
  body:
    type: multipart-form
    data:
      - name: Name
        type: text
        value: Apiary North1 Updated
      - name: Latitude
        type: text
        value: "45.2675"
      - name: Longitude
        type: text
        value: "19.8340"
      - name: Description
        type: text
        value: Updated test apiary description
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("DEBUG RESPONSE [UpdateApiary.yml] status:", res.status, "body:", JSON.stringify(res.body));
    - type: before-request
      code: |-
        bru.setGlobalEnvVar("jwt_token", bru.getGlobalEnvVar("beekeeper_token"));
